packages:
  - apps/*
  - packages/*

# Build scripts are blocked by default; only these packages may run them.
allowBuilds:
  "@prisma/engines": true
  "@parcel/watcher": false
  "@swc/core": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

catalog:
  # Tooling
  "@eslint/js": 10.0.1
  "@next/eslint-plugin-next": 16.4.6
  "@types/cookie-parser": 1.4.10
  "@types/node": 26.6.6
  "@types/pg": 8.23.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/supertest": 7.2.1
  eslint: 10.15.0
  eslint-plugin-react-hooks: 7.1.1
  globals: 17.14.0
  prettier: 3.10.1
  turbo: 2.11.13
  typescript: 6.0.3
  typescript-eslint: 8.73.0

  # API
  "@nestjs/cli": 12.0.13
  "@nestjs/common": 12.5.1
  "@nestjs/core": 12.5.1
  "@nestjs/jwt": 12.0.5
  "@nestjs/platform-express": 12.5.1
  "@nestjs/testing": 12.5.1
  cookie-parser: 1.4.7
  helmet: 8.3.0
  ioredis: 6.0.0
  pino: 10.4.0
  pino-http: 11.0.0
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  zod: 4.6.7

  # Database
  "@prisma/adapter-pg": 7.10.1
  "@prisma/client": 7.10.1
  pg: 8.23.1
  prisma: 7.10.1

  # Web and UI
  "@tailwindcss/postcss": 4.3.5
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  lucide-react: 1.74.0
  next: 16.4.6
  next-intl: 4.15.1
  radix-ui: 1.8.1
  react: 19.3.1
  react-dom: 19.3.1
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.5
  tw-animate-css: 1.4.0

  # Tests
  "@axe-core/playwright": 4.14.0
  "@playwright/test": 1.65.1
  "@swc/core": 1.16.22
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.12
  jsdom: 31.0.1
  supertest: 7.3.2
  unplugin-swc: 2.0.0
  vitest: 5.1.1

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.13"
  - "@turbo/darwin-arm64@2.11.13"
  - "@turbo/linux-64@2.11.13"
  - "@turbo/linux-arm64@2.11.13"
  - "@turbo/windows-64@2.11.13"
  - "@turbo/windows-arm64@2.11.13"
  - "@vitest/mocker@5.1.1"
  - "@vitest/spy@5.1.1"
  - turbo@2.11.13
  - vitest@5.1.1
